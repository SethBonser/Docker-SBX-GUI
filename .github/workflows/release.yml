name: Release

# Manually triggered from the Actions tab ("Run workflow") — you type in the version, nothing is
# auto-computed from commit history. Builds Windows (nsis + msi) on windows-latest, macOS (dmg)
# on macos-latest, and Linux (AppImage) on ubuntu-latest, then publishes a single GitHub Release
# with whatever installers came out attached. Windows is the only platform this project has
# actually been developed/tested on directly — macOS and Linux both build on real hosts for
# those OSes (unlike this project's own Windows dev machine, which can't cross-build either),
# but neither has had real-world use yet (see README's "Running on macOS"/"Running on Linux"
# sections). Both are allowed to fail without blocking the release (`continue-on-error`) so a
# first-run hiccup on either doesn't hold back a Windows release; the release still goes out
# with whatever subset of installers actually built, and the workflow's own guard refuses to
# publish an empty release if somehow nothing built at all.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a "v" prefix (e.g. 0.10.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (beta) on GitHub — recommended until the app has had real-world testing'
        required: false
        type: boolean
        default: true
      notes:
        description: 'Release notes (leave blank to use the default unsigned-build warning text)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check version is X.Y.Z
        run: |
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be in X.Y.Z format (e.g. 0.10.0), got: ${{ inputs.version }}"
            exit 1
          fi

  build-windows:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set package.json version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.msi
          if-no-files-found: error

  build-macos:
    needs: validate-version
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set package.json version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build:mac
      - uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: release/*.dmg
          if-no-files-found: error

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set package.json version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      - run: npm run build:linux
      - uses: actions/upload-artifact@v7
        with:
          name: linux-installer
          path: release/*.AppImage
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # productName ("Docker Sandbox GUI") has spaces, so every installer filename does too —
          # NUL-delimited find + a bash array (not a plain string) is required here, confirmed live:
          # an earlier unquoted-$FILES-string version word-split "Docker Sandbox GUI-0.10.0-arm64.dmg"
          # into separate broken arguments, which `gh` then tried to glob-match and failed on.
          mapfile -d '' -t FILES < <(find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.AppImage" \) -print0)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installers were produced by any build job — refusing to create an empty release."
            exit 1
          fi
          gh release create "v${{ inputs.version }}" "${FILES[@]}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${{ inputs.version }}" \
            --notes "${{ inputs.notes != '' && inputs.notes || format('Docker Sandbox GUI v{0}. Unsigned on every platform — Windows SmartScreen and macOS Gatekeeper will both flag it on first run, and Linux/macOS builds are unverified beyond this pipeline (see README).', inputs.version) }}" \
            $( [ "${{ inputs.prerelease }}" = "true" ] && echo "--prerelease" )
